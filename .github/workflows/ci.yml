name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  quality-gate:
    name: Code Quality & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Quality Gate (Red Lines & Pytest)
        run: python scripts/check_project.py
        env:
          PYTHONUTF8: "1"

      - name: Prepare Environment for Smoke Test
        run: |
          cp .env.example .env
          # 模拟创建向量缓存文件，满足 smoke 依赖
          mkdir -p data
          touch data/embeddings.pkl

      - name: Seed Knowledge Database
        run: |
          # 这一步会执行建表并导入知识库
          python scripts/seed_knowledge.py

      - name: Start FastAPI Server
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 7001 &
          # 等待服务启动并监听端口
          sleep 5

      - name: Run Smoke Test
        run: python scripts/smoke_test.py
