{% if total_pages > 1 %}
<div class="pagination">
  {% if page > 1 %}
  <a href="{{ request.url.include_query_params(page=page - 1) }}" class="btn">上一页</a>
  {% endif %}
  <span class="page-info">第 {{ page }} / {{ total_pages }} 页</span>
  {% if page < total_pages %}
  <a href="{{ request.url.include_query_params(page=page + 1) }}" class="btn">下一页</a>
  {% endif %}
</div>
{% endif %}
