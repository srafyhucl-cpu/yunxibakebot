{% extends "admin/base.html" %}
{% block content %}
<style>
.topbar,#bottom-nav{display:none!important}.main{padding:0!important}
:root{--g:#07c160;--bg:#ededed;--sb:#f0f0f0;--bd:#d9d9d9}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
.wc-wrap{position:fixed;inset:0;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
.wc-body{flex:1;display:flex;overflow:hidden;min-height:0}
/* 侧边栏 */
.wc-sb{width:240px;flex-shrink:0;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.sl-hd{padding:10px 12px 8px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sl-hd-t{font-size:14px;font-weight:600;color:#555}
.sl-new{width:30px;height:30px;border:none;background:none;cursor:pointer;border-radius:4px;font-size:22px;color:#555;display:flex;align-items:center;justify-content:center}
.sl-new:hover{background:rgba(0,0,0,.07)}
.sl-list{flex:1;overflow-y:auto}
.sl-empty{padding:32px 16px;text-align:center;font-size:13px;color:#aaa}
.conv-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none;border-bottom:1px solid rgba(0,0,0,.04)}
.conv-item:hover{background:rgba(0,0,0,.04)}
.conv-item.active{background:#c8edba}
.conv-item.pinned{background:#f4f4f4}
.conv-item.active.pinned{background:#c8edba}
.conv-ava{width:40px;height:40px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;position:relative}
.conv-pin{position:absolute;top:-3px;right:-3px;font-size:9px}
.conv-body{flex:1;min-width:0}
.conv-top{display:flex;justify-content:space-between;align-items:baseline}
.conv-name{font-size:14px;font-weight:500;color:#191919;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.conv-time{font-size:11px;color:#aaa;flex-shrink:0;margin-left:4px}
.conv-prev{font-size:12px;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
/* 聊天区 */
.wc-chat{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;min-width:0}
.chat-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#bbb}
.chat-empty .ei{font-size:48px;opacity:.25}
.chat-empty .et{font-size:14px}
.chat-inner{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.ct-bar{height:54px;background:#f7f7f7;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;flex-shrink:0}
.ct-back{display:none;border:none;background:none;font-size:22px;cursor:pointer;color:#555;padding:6px 10px 6px 2px;line-height:1}
.ct-title{flex:1;font-size:15px;font-weight:600;color:#191919;text-align:center}
.ct-menu{border:none;background:none;font-size:20px;cursor:pointer;color:#555;padding:6px 4px 6px 10px;border-radius:4px;line-height:1;letter-spacing:2px}
.ct-menu:hover{background:rgba(0,0,0,.06)}
.chat-msgs{flex:1;overflow-y:auto;padding:14px 20px;display:flex;flex-direction:column;gap:10px}
.chat-ib{background:#f7f7f7;border-top:1px solid var(--bd);padding:10px 12px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.chat-ib input{flex:1;border:none;border-radius:4px;padding:10px 12px;font-size:15px;outline:none;background:#fff;font-family:inherit}
.chat-ib button{background:var(--g);color:#fff;border:none;border-radius:4px;padding:10px 18px;font-size:14px;cursor:pointer;font-weight:500}
.chat-ib button:disabled{opacity:.45;cursor:not-allowed}
/* 气泡 */
.msg-row{display:flex;gap:8px;align-items:flex-start}
.msg-row.end{align-self:flex-end;flex-direction:row-reverse;max-width:72%}
.msg-row.start{align-self:flex-start;max-width:72%}
.cava{width:38px;height:38px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
.cava.u{background:#abc8e2}
.cava.a{background:#07c160;font-size:20px}
.cava.ph{background:transparent!important;visibility:hidden}
.bcol{min-width:0}
.msg-row.end .bcol{display:flex;justify-content:flex-end}
.bubble{display:inline-block;padding:9px 13px;font-size:15px;line-height:1.6;word-break:break-word;white-space:pre-wrap;position:relative}
.bubble.user{background:#95ec69;color:#191919;border-radius:4px 2px 4px 4px}
.bubble.ai{background:#fff;color:#191919;border-radius:2px 4px 4px 4px}
.bubble.loading{opacity:.55}
.bubble.user::after{content:"";position:absolute;top:11px;right:-5px;border:5px solid transparent;border-left-color:#95ec69;border-right-width:0}
.bubble.ai::after{content:"";position:absolute;top:11px;left:-5px;border:5px solid transparent;border-right-color:#fff;border-left-width:0}
.media-container{display:block}
/* 弹窗 */
.nm-ov{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.nm-ov.hidden{display:none}
.nm-box{background:#fff;border-radius:12px;padding:28px 24px;width:420px;max-width:90vw;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.nm-title{font-size:18px;font-weight:700;color:#191919;margin-bottom:4px}
.nm-sub{font-size:13px;color:#999;margin-bottom:18px}
.nm-presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.nm-p{border:1.5px solid #e0e0e0;background:#fff;border-radius:20px;padding:7px 16px;font-size:14px;cursor:pointer;color:#333;font-family:inherit;transition:all .15s}
.nm-p:hover,.nm-p.sel{border-color:var(--g);color:var(--g)}
.nm-p.sel{background:#e8f9ef;font-weight:600}
.nm-div{display:flex;align-items:center;gap:8px;color:#ccc;font-size:12px;margin-bottom:14px}
.nm-div::before,.nm-div::after{content:"";flex:1;height:1px;background:#eee}
.nm-cl{font-size:13px;color:#666;margin-bottom:6px;display:block}
.nm-ci{width:100%;border:1.5px solid #e0e0e0;border-radius:8px;padding:10px 14px;font-size:15px;outline:none;font-family:inherit}
.nm-ci:focus{border-color:var(--g)}
.nm-acts{display:flex;gap:10px;margin-top:18px}
.nm-btn{flex:1;padding:12px;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:500;font-family:inherit}
.nm-btn.cancel{background:#f3f3f3;color:#666}
.nm-btn.start{background:var(--g);color:#fff}
.nm-btn.start:disabled{background:#c3e8d4;cursor:not-allowed}
/* 右键菜单 */
.ctx-menu{position:fixed;z-index:900;background:#fff;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.16);overflow:hidden;min-width:120px;display:none}
.ctx-menu.show{display:block}
.ctx-item{display:block;width:100%;padding:12px 18px;border:none;background:none;text-align:left;font-size:14px;cursor:pointer;color:#333;font-family:inherit}
.ctx-item:hover{background:#f5f5f5}
.ctx-item.danger{color:#e74c3c}
/* 抽屉 */
.dr-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:500}
.dr-ov.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(300px,85vw);background:#fff;z-index:510;transform:translateX(100%);transition:transform .25s ease;box-shadow:-6px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column;overflow-y:auto}
.drawer.open{transform:translateX(0)}
.dr-body{padding:20px 16px;flex:1}
.dr-sec{margin-bottom:22px}
.dr-sec-t{font-size:12px;color:#999;font-weight:600;margin-bottom:10px;letter-spacing:.5px}
.dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dr-q{border:1px solid #eee;border-radius:10px;background:#fff;padding:11px;cursor:pointer;text-align:left}
.dr-qt{font-size:13px;font-weight:600;display:block;color:#333}
.dr-qd{font-size:11px;color:#999;display:block;margin-top:4px}
.dr-dbr{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.dr-dbl{color:#999}
.dr-dbv{color:#333;font-weight:500}
.dr-foot{padding:0 16px 20px}
.dr-foot a{display:block;width:100%;padding:12px 16px;border:1px solid #eee;border-radius:10px;background:#fff;text-decoration:none;color:#333;font-size:14px}
/* 移动端 */
@media(max-width:799px){
  .wc-sb{width:100%}
  .wc-chat{display:none;position:fixed;inset:0;z-index:50}
  .wc-body.mc .wc-sb{display:none}
  .wc-body.mc .wc-chat{display:flex}
  .ct-back{display:block!important}
  .chat-empty{display:none!important}
  .chat-msgs{padding:10px 12px}
}
@media(min-width:800px){.ct-back{display:none!important}}
</style>

<div class="wc-wrap">
 <div class="wc-body" id="wb">

<!-- 用户角色弹窗 -->
<div class="nm-ov hidden" id="nm-ov">

<script>
/* ── UMP 富媒体引擎 ── */
const UMP = {
  card(p){
    const t=esc(p.get("title")||""),pr=esc(p.get("price")||""),src=p.get("src")||"",url=p.get("url")||"#";
    const img=src?`<img src="${src}" style="width:100%;height:160px;object-fit:cover;display:block;" onerror="this.parentElement.style.display='none'">`
      :`<div style="width:100%;height:160px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:32px;">&#x1f370;</div>`;
    return `<a href="${url}" target="_blank" style="text-decoration:none;display:block;width:220px;"><div style="background:#fff;border:.5px solid rgba(0,0,0,.12);border-radius:8px;overflow:hidden;">${img}<div style="padding:10px 12px 8px;"><div style="font-size:14px;font-weight:600;color:#1a1a1a;line-height:1.4;margin-bottom:6px;">${t}</div><div style="font-size:15px;font-weight:700;color:#e63d3d;">&#xffe5;${pr}</div></div><div style="height:.5px;background:#e8e8e8;"></div><div style="display:flex;align-items:center;padding:7px 10px;gap:5px;"><div style="width:15px;height:15px;background:#07c160;border-radius:3px;display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-size:7px;font-weight:900;">小</span></div><span style="font-size:11px;color:#9b9b9b;">有赞小程序</span><span style="margin-left:auto;font-size:11px;color:#c0c0c0;">›</span></div></div></a>`;
  },
  parse(raw){
    let text=raw;
    const li=text.lastIndexOf("[UMP:");
    if(li!==-1&&text.indexOf("]",li)===-1) text=text.slice(0,li);
    const re=/\[UMP:\s*(.*?)\s*\]/g;
    const cleanText=text.replace(re,"").trim();
    let html="",m; re.lastIndex=0;
    while((m=re.exec(text))!==null){
      const p=new URLSearchParams(m[1].replace(/[`\s]/g,""));
      const type=(p.get("type")||"").trim();
      if(this[type]) html+=this[type](p);
    }
    return {text:cleanText,html};
  }
};

/* ── 工具 ── */
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function _ck(n){const m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?decodeURIComponent(m[1]):"";}
const _H={headers:{Authorization:"Bearer "+_ck("admin_token")}};
function _ls(k,v){const K="ct_"+k;if(v===undefined)return localStorage.getItem(K);if(v===null)localStorage.removeItem(K);else localStorage.setItem(K,v);}
function fmtT(iso){
  if(!iso)return"";
  const d=new Date(iso.replace(" ","T")),now=new Date(),dd=now-d;
  if(dd<86400000&&d.getDate()===now.getDate())return d.toTimeString().slice(0,5);
  if(dd<172800000)return"昨天";
  const dy=["日","一","二","三","四","五","六"];
  if(dd<604800000)return"周"+dy[d.getDay()];
  return(d.getMonth()+1)+"/"+d.getDate();
}
function nowT(){return new Date().toTimeString().slice(0,5);}

/* ── 状态 ── */
let _sid=_ls("sid")||"",_uid=_ls("uid")||"",_udisp=_ls("udisp")||"";
let _named=_ls("named")==="1",_pname="",_pdisp="",_sending=false;
let _ctxId="",_ctxPinned=false,_lpt=null,_nmSel="";

/* ── 头像颜色 ── */
const ACOLORS=["#5c9ee6","#e67c5c","#5cbe8c","#a068d4","#e6a83a","#5cb8d4","#d45c8c","#7db35c"];
function aColor(n){let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return ACOLORS[h%ACOLORS.length];}
function aChar(n){return n?n[0].toUpperCase():"?";}

/* ── 会话列表 ── */
async function loadList(){
  try{
    const r=await fetch("/api/v1/admin/chat-test/sessions",_H);
    const d=await r.json();
    const el=document.getElementById("sl-list");
    if(d.code!==0||!d.data||!d.data.length){el.innerHTML='<div class="sl-empty">暂无对话，点击 ＋ 新建</div>';return;}
    el.innerHTML=d.data.map(s=>{
      const name=s.name||s.user_display||s.user_id;
      const prev=esc(s.last_msg||""),time=fmtT(s.updated_at||s.created_at);
      const ac=s.id===_sid?" active":"",pc=s.pinned?" pinned":"";
      const pb=s.pinned?'<span class="conv-pin">&#x1f4cc;</span>':"";
      const en=esc(name),ei=esc(s.id),eu=esc(s.user_id);
      return `<div class="conv-item${ac}${pc}" data-id="${ei}"
        onclick="openConv('${ei}','${en}','${eu}')"
        oncontextmenu="ctxShow(event,'${ei}',${s.pinned?1:0});return false;"
        ontouchstart="lpS(event,'${ei}',${s.pinned?1:0})" ontouchend="lpE()" ontouchmove="lpE()">
        <div class="conv-ava" style="background:${aColor(name)}">${esc(aChar(name))}${pb}</div>
        <div class="conv-body">
          <div class="conv-top"><span class="conv-name">${en}</span><span class="conv-time">${time}</span></div>
          <div class="conv-prev">${prev||"&#x200b;"}</div>
        </div></div>`;
    }).join("");
  }catch(e){console.error(e);}
}

/* ── 打开对话 ── */
async function openConv(id,name,uid){
  _sid=id;_ls("sid",id);_uid=uid;_ls("uid",uid);_udisp=name;_ls("udisp",name);
  _named=true;_ls("named","1");_pname="";_pdisp="";
  document.getElementById("ct-title").textContent=name;
  showChat();
  try{
    const r=await fetch("/api/v1/admin/sessions/"+id+"/messages",_H);
    const d=await r.json();
    const el=document.getElementById("chat-msgs");el.innerHTML="";
    if(d.code===0&&d.data)for(const m of d.data)addMsg(m.role==="user"?"user":"assistant",m.content);
    scrollB();
  }catch(e){}
  loadList();focusIn();
}

/* ── UI 切换 ── */
function showChat(){
  document.getElementById("chat-empty").style.display="none";
  const ci=document.getElementById("chat-inner");
  ci.style.cssText="display:flex;flex:1;flex-direction:column;overflow:hidden;min-height:0;";
  document.getElementById("wb").classList.add("mc");
}
function mobileBack(){document.getElementById("wb").classList.remove("mc");}
function focusIn(){const e=document.getElementById("user-input");if(e)e.focus();}
function scrollB(){const e=document.getElementById("chat-msgs");e.scrollTop=e.scrollHeight;}

/* ── 新建弹窗 ── */
function onNewChat(){
  _nmSel="";
  document.querySelectorAll(".nm-p").forEach(b=>b.classList.remove("sel"));
  document.getElementById("nm-ci").value="";
  document.getElementById("nm-start").disabled=true;
  document.getElementById("nm-ov").classList.remove("hidden");
}
function nmSel(btn,name){
  _nmSel=name;
  document.querySelectorAll(".nm-p").forEach(b=>b.classList.remove("sel"));
  btn.classList.add("sel");
  document.getElementById("nm-ci").value="";
  document.getElementById("nm-start").disabled=false;
}
function nmCustom(val){
  _nmSel=val.trim();
  document.querySelectorAll(".nm-p").forEach(b=>b.classList.remove("sel"));
  document.getElementById("nm-start").disabled=!_nmSel;
}
function nmCancel(){document.getElementById("nm-ov").classList.add("hidden");}
function nmConfirm(){
  const name=_nmSel||document.getElementById("nm-ci").value.trim();
  if(!name)return;
  _pdisp=name;_pname=name+" · "+nowT();
  _sid="";_ls("sid",null);
  _uid="t_"+encodeURIComponent(name)+"_"+Date.now();_ls("uid",_uid);
  _udisp=name;_ls("udisp",name);_named=false;_ls("named",null);
  document.getElementById("nm-ov").classList.add("hidden");
  document.getElementById("ct-title").textContent=name;
  document.getElementById("chat-msgs").innerHTML="";
  addMsg("assistant","👋 你好，我是在线客服，有什么可以帮你的~");
  showChat();focusIn();
  ["dbg-intent","dbg-time","dbg-tokens"].forEach(id=>document.getElementById(id).textContent="-");
}

/* ── 消息渲染 ── */
function addMsg(role,content){
  const msgs=document.getElementById("chat-msgs");
  if(role==="user"){
    msgs.innerHTML+=`<div class="msg-row end"><div class="bcol"><div class="bubble user">${esc(content)}</div></div><div class="cava u">👤</div></div>`;
  }else{
    const{text,html}=UMP.parse(content);
    const ai='<div class="cava a">🍰</div>',ph='<div class="cava ph"></div>';
    let rows="";
    if(text) rows+=`<div class="msg-row start">${ai}<div class="bcol"><div class="bubble ai">${esc(text)}</div></div></div>`;
    if(html) rows+=`<div class="msg-row start">${text?ph:ai}<div class="bcol"><div class="media-container">${html}</div></div></div>`;
    if(!rows) rows=`<div class="msg-row start">${ai}<div class="bcol"><div class="bubble ai">${esc(content)}</div></div></div>`;
    msgs.innerHTML+=rows;
  }
}

/* ── 发送 ── */
async function send(msg){
  const inp=document.getElementById("user-input");
  const text=msg||inp.value.trim();
  if(!text||_sending)return;
  if(!msg)inp.value="";
  _sending=true;document.getElementById("send-btn").disabled=true;
  addMsg("user",text);
  const msgs=document.getElementById("chat-msgs");
  msgs.innerHTML+=`<div class="msg-row start" id="lr"><div class="cava a">🍰</div><div class="bcol"><div class="bubble ai loading">⏳ 正在思考...</div></div></div>`;
  scrollB();
  const t0=Date.now();
  try{
    const resp=await fetch("/api/v1/admin/chat-test",{method:"POST",headers:{"Content-Type":"application/json",..._H.headers},body:JSON.stringify({content:text,user_id:_uid})});
    const data=await resp.json();
    document.getElementById("lr")?.remove();
    addMsg("assistant",data.reply||"(无回复)");
    if(data.session_id){
      const first=!_sid;_sid=data.session_id;_ls("sid",data.session_id);
      if(first&&_pname){
        await fetch("/api/v1/admin/chat-test/save",{method:"POST",headers:{"Content-Type":"application/json",..._H.headers},body:JSON.stringify({session_id:_sid,name:_pname,user_display:_pdisp})}).catch(()=>{});
        _pname="";_pdisp="";_named=true;_ls("named","1");
      }
    }
    loadList();scrollB();
    const IM={1:"商品咨询",2:"规则咨询",3:"运费费用",4:"配送履约",5:"订单办理",6:"售后异常",7:"人工服务",8:"闲聊其他"};
    document.getElementById("dbg-intent").textContent=IM[data.intent]||data.intent||"-";
    document.getElementById("dbg-time").textContent=((Date.now()-t0)/1000).toFixed(1)+"s";
    document.getElementById("dbg-tokens").textContent=data.tokens||"-";
  }catch(e){document.getElementById("lr")?.remove();addMsg("assistant","❌ 请求失败");}
  _sending=false;document.getElementById("send-btn").disabled=false;focusIn();
}
function qSend(t){drClose();send(t);}

/* ── 右键/长按菜单 ── */
function ctxShow(e,id,pinned){
  _ctxId=id;_ctxPinned=!!pinned;
  const m=document.getElementById("ctx-menu");
  document.getElementById("ctx-pin-btn").textContent=pinned?"取消置顶":"置顶对话";
  m.style.left=Math.min(e.clientX,innerWidth-140)+"px";
  m.style.top=Math.min(e.clientY,innerHeight-90)+"px";
  m.classList.add("show");
}
function ctxHide(){document.getElementById("ctx-menu").classList.remove("show");}
function lpS(e,id,p){lpE();_lpt=setTimeout(()=>{const t=e.touches[0];ctxShow({clientX:t.clientX,clientY:t.clientY},id,p);},500);}
function lpE(){if(_lpt){clearTimeout(_lpt);_lpt=null;}}
async function ctxPin(){
  ctxHide();
  try{await fetch("/api/v1/admin/chat-test/session/"+_ctxId+"/pin",{method:"POST",..._H});loadList();}catch(e){}
}
async function ctxDelete(){
  ctxHide();if(!confirm("确定删除此对话？"))return;
  try{await fetch("/api/v1/admin/chat-test/session/"+_ctxId,{method:"DELETE",..._H});}catch(e){}
  if(_ctxId===_sid){
    _sid="";_ls("sid",null);_named=false;_ls("named",null);_pname="";_pdisp="";
    document.getElementById("chat-msgs").innerHTML="";
    document.getElementById("ct-title").textContent="对话";
    document.getElementById("wb").classList.remove("mc");
    document.getElementById("chat-inner").style.display="none";
    document.getElementById("chat-empty").style.display="";
  }
  loadList();
}

/* ── 抽屉 ── */
function drToggle(){document.getElementById("drawer").classList.toggle("open");document.getElementById("dr-ov").classList.toggle("show");}
function drClose(){document.getElementById("drawer").classList.remove("open");document.getElementById("dr-ov").classList.remove("show");}

/* ── 初始化 ── */
document.addEventListener("click",e=>{if(!document.getElementById("ctx-menu").contains(e.target))ctxHide();});
(async function(){
  await loadList();
  if(_sid){await openConv(_sid,_udisp||_uid,_uid);}
  else{onNewChat();}
})();
</script>
{% endblock %}
