{% extends "admin/base.html" %}
{% block content %}
<style>
@media (max-width: 767px) {
  .stats { grid-template-columns: 1fr !important; gap: 8px !important; }
  .stat-card { flex-direction: row !important; align-items: center !important; gap: 14px !important; }
  .stat-icon { width: 44px !important; height: 44px !important; font-size: 20px !important; flex-shrink: 0; }
  .stat-number { font-size: 26px !important; }
}
</style>
<div class="page-header">
  <h1>概览</h1>
  <p>系统运行状态与关键指标</p>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="stat-icon red">🔔</div>
    <div>
      <div class="stat-label">待处理转人工</div>
      <div class="stat-number" id="pending-count">{{ pending_count }}</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon blue">💬</div>
    <div>
      <div class="stat-label">活跃会话</div>
      <div class="stat-number" id="active-sessions">{{ active_sessions }}</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon green">📚</div>
    <div>
      <div class="stat-label">知识库条目</div>
      <div class="stat-number">{{ kb_count }}</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title">📋 系统状态</div>
  <div class="status-list">
    <div class="status-item">
      <span class="status-dot dot-green"></span>
      <span class="status-name">DeepSeek API</span>
      <span class="status-badge green">已连接</span>
    </div>
    <div class="status-item">
      <span class="status-dot dot-green"></span>
      <span class="status-name">知识库</span>
      <span class="status-badge green">{{ kb_count }} 条已就绪</span>
    </div>
    <div class="status-item">
      <span class="status-dot dot-green"></span>
      <span class="status-name">有赞对接</span>
      <span class="status-badge green">已对接</span>
    </div>
    <div class="status-item">
      <span class="status-dot dot-orange"></span>
      <span class="status-name">小程序对接</span>
      <span class="status-badge orange">待域名备案</span>
    </div>
    <div class="status-item">
      <span class="status-dot dot-orange"></span>
      <span class="status-name">企业微信对接</span>
      <span class="status-badge orange">待认证配置</span>
    </div>
  </div>
</div>
{% endblock %}
