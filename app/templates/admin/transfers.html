{% extends "admin/base.html" %}
{% block content %}
<style>
/* 转人工页面布局 */
.transfer-layout {
  display: flex; gap: 20px; align-items: flex-start;
}
.transfer-table-wrap { flex: 1; min-width: 0; }

/* 对话面板 - 右侧抽屉 */
.conv-drawer {
  width: 380px; max-width: 100%;
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border);
  display: none; flex-direction: column;
  max-height: calc(100vh - 140px); position: sticky; top: 20px;
}
.conv-drawer.open { display: flex; }
.conv-drawer-header {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 14px;
  display: flex; justify-content: space-between; align-items: center;
}
.conv-drawer-msgs {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
  min-height: 200px;
}
.conv-msg { max-width: 90%; padding: 8px 14px; font-size: 14px; white-space: pre-wrap; }
.conv-msg.user {
  align-self: flex-end; background: var(--primary); color: #fff;
  border-radius: 12px 12px 4px 12px;
}
.conv-msg.ai {
  align-self: flex-start; background: var(--bg);
  border-radius: 12px 12px 12px 4px;
}
.conv-empty {
  align-self: center; color: var(--text-muted); font-size: 13px; margin: auto;
}
.conv-drawer-footer {
  padding: 12px 16px; border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.conv-drawer-footer input {
  flex: 1; border: 1px solid var(--border); border-radius: 20px;
  padding: 8px 14px; font-size: 13px; outline: none;
}
.conv-drawer-footer input:focus { border-color: var(--primary); }

/* 响应式 */
@media (max-width: 768px) {
  .transfer-layout { flex-direction: column; }
  .conv-drawer {
    width: 100%; max-height: 60vh; position: static;
  }
}
</style>

<div class="page-header">
  <h1>🔔 转人工队列</h1>
  <p>待处理的客户转人工请求</p>
</div>

<div class="transfer-layout">
  <div class="transfer-table-wrap">
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>客户</th>
            <th>渠道</th>
            <th>原因</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          {% if transfers %}
          {% for t in transfers %}
          <tr>
            <td>{{ t.user_id[:12] }}...</td>
            <td>{{ t.channel or "小程序" }}</td>
            <td>{{ t.reason[:30] or "-" }}</td>
            <td><span class="badge badge-pending">等待中</span></td>
            <td class="form-actions">
              <button class="btn btn-success btn-sm" onclick="viewConv('{{ t.session_id }}')">查看对话</button>
              <button class="btn btn-success btn-sm" onclick="acceptTransfer('{{ t.id }}')">接单</button>
              <button class="btn btn-danger btn-sm" onclick="closeTransfer('{{ t.id }}')">关闭</button>
            </td>
          </tr>
          {% endfor %}
          {% else %}
          <tr><td colspan="5"><div class="empty">暂无待处理的转人工请求</div></td></tr>
          {% endif %}
        </tbody>
      </table>
    </div>
  </div>

  <div class="conv-drawer" id="conv-drawer">
    <div class="conv-drawer-header">
      <span id="conv-title">对话详情</span>
      <button class="btn btn-sm btn-neutral" onclick="closeConv()">✕</button>
    </div>
    <div class="conv-drawer-msgs" id="conv-msgs">
      <div class="conv-empty">选择一个请求查看对话</div>
    </div>
    <div class="conv-drawer-footer">
      <input type="text" id="conv-input" placeholder="输入回复...">
      <button class="btn btn-primary btn-sm" onclick="sendReply()">发送</button>
    </div>
  </div>
</div>

<script>
var _sid = '';
var _auth = {headers: {'Authorization': 'Bearer 100200'}};

async function viewConv(sessionId) {
  _sid = sessionId;
  document.getElementById('conv-title').textContent = '会话 ' + sessionId.slice(0, 8);
  document.getElementById('conv-drawer').classList.add('open');
  var el = document.getElementById('conv-msgs');
  el.innerHTML = '<div class="conv-empty">⏳ 加载中...</div>';
  try {
    var r = await fetch('/api/v1/admin/sessions/' + sessionId + '/messages', _auth);
    var d = await r.json();
    if (d.code !== 0 || !d.data || d.data.length === 0) {
      el.innerHTML = '<div class="conv-empty">暂无对话记录</div>'; return;
    }
    el.innerHTML = '';
    for (var m of d.data) {
      var cls = m.role === 'user' ? 'conv-msg user' : 'conv-msg ai';
      el.innerHTML += '<div class="' + cls + '">' + esc(m.content) + '</div>';
    }
    el.scrollTop = el.scrollHeight;
  } catch(e) {
    el.innerHTML = '<div class="conv-empty" style="color:var(--danger)">加载失败</div>';
  }
}

function closeConv() {
  document.getElementById('conv-drawer').classList.remove('open');
}

async function acceptTransfer(id) {
  try {
    var r = await fetch('/api/v1/admin/transfers/' + id + '/accept', { method: 'POST', ..._auth });
    var d = await r.json();
    if (d.code === 0) { showToast('已接单', 'success'); location.reload(); }
    else showToast(d.message || '接单失败', 'error');
  } catch(e) { showToast('接单失败', 'error'); }
}

async function closeTransfer(id) {
  try {
    var r = await fetch('/api/v1/admin/transfers/' + id + '/close', { method: 'POST', ..._auth });
    var d = await r.json();
    if (d.code === 0) { showToast('已关闭', 'success'); location.reload(); }
    else showToast(d.message || '关闭失败', 'error');
  } catch(e) { showToast('关闭失败', 'error'); }
}

async function sendReply() {
  if (!_sid) return;
  var inp = document.getElementById('conv-input');
  var c = inp.value.trim();
  if (!c) return;
  try {
    var r = await fetch('/api/v1/admin/sessions/' + _sid + '/reply?content=' + encodeURIComponent(c), { method: 'POST', ..._auth });
    var d = await r.json();
    if (d.code === 0) { showToast('已发送', 'success'); inp.value = ''; viewConv(_sid); }
    else showToast(d.message || '发送失败', 'error');
  } catch(e) { showToast('发送失败', 'error'); }
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
</script>
{% endblock %}
