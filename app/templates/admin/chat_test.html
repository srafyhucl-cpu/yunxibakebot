{% extends "admin/base.html" %}
{% block content %}
<style>
/* 移动端：隐藏 base 顶栏，chat 自己的顶栏接管导航 */
@media (max-width: 767px) {
  .topbar { display: none !important; }
  .main { padding: 0 !important; }
  .chat-page {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: #ededed;
  }
}
@media (min-width: 768px) {
  .chat-page {
    display: flex; flex-direction: column;
    height: calc(100dvh - 64px);
    background: #ededed;
    margin: -32px;
  }
}
.chat-topbar {
  background: var(--primary); color: #fff;
  display: flex; align-items: center; padding: 0 4px 0 12px;
  height: 48px; flex-shrink: 0;
}
.chat-topbar .title {
  flex: 1; text-align: center; font-size: 16px; font-weight: 600;
}
.chat-topbar button {
  background: none; border: none; color: #fff; font-size: 24px;
  min-width: 48px; min-height: 48px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

.chat-msgs {
  flex: 1; overflow-y: auto; padding: 16px 12px;
  display: flex; flex-direction: column; gap: 12px;
  -webkit-overflow-scrolling: touch;
}
.msg-row { display: flex; max-width: 85%; }
.msg-row.end { align-self: flex-end; }
.msg-row.start { align-self: flex-start; }
.bubble {
  padding: 8px 12px; font-size: 15px; line-height: 1.6;
  word-break: break-word; white-space: pre-wrap;
}
.bubble.user { background: #95ec69; color: #000; border-radius: 6px 6px 2px 6px; }
.bubble.ai { background: #fff; color: #000; border-radius: 6px 6px 6px 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.bubble.ai.loading { opacity: 0.5; }

.chat-notice {
  font-size: 11px; color: #b0b0b0; text-align: center;
  padding: 6px 12px; flex-shrink: 0;
}

.chat-inputbar {
  background: #f7f7f7; border-top: 1px solid #ddd;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; flex-shrink: 0;
}
.chat-inputbar input {
  flex: 1; border: 1px solid #ddd; border-radius: 4px;
  padding: 10px 12px; font-size: 15px; outline: none; background: #fff;
}
.chat-inputbar button {
  background: var(--primary); color: #fff; border: none;
  border-radius: 4px; padding: 10px 16px; font-size: 14px;
  cursor: pointer; white-space: nowrap;
}

/* Drawer - fixed to viewport */
.drawer-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.4); z-index: 500;
}
.drawer-overlay.show { display: block; }
.drawer {
  position: fixed; top: 0; right: -300px; bottom: 0; width: 280px;
  background: #fff; z-index: 510; transition: right 0.25s ease;
  display: flex; flex-direction: column; overflow-y: auto;
}
.drawer.open { right: 0; }
.drawer-head {
  padding: 16px 12px; font-size: 16px; font-weight: 600;
  border-bottom: 1px solid #eee;
  display: flex; justify-content: space-between; align-items: center;
}
.drawer-head button {
  width: 48px; height: 48px; font-size: 22px;
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.drawer-section { padding: 12px 0; border-bottom: 8px solid #f5f5f5; }
.drawer-section h4 { padding: 0 16px; font-size: 13px; color: #999; margin-bottom: 8px; }

.drawer-item {
  padding: 12px 16px; cursor: pointer; font-size: 15px;
  display: flex; justify-content: space-between; align-items: center;
}
.drawer-item:active { background: #f0f0f0; }
.drawer-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-item .del {
  color: #bbb; padding: 8px 12px; font-size: 18px; cursor: pointer;
}
.drawer-item .del:active { color: var(--danger); }
.drawer-item.active { background: #fff3e0; }

.drawer-btn {
  display: block; width: 100%; text-align: left;
  padding: 12px 16px; border: none; background: none;
  cursor: pointer; font-size: 15px; text-decoration: none; color: var(--text);
}
.drawer-btn:active { background: #f0f0f0; }

.drawer-debug { padding: 12px 16px; }
.drawer-debug table { width: 100%; font-size: 13px; }
.drawer-debug td { padding: 4px 0; }
.drawer-debug td:first-child { color: #999; width: 50px; }

/* Modal - fixed to viewport */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.4); z-index: 600;
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 12px; padding: 24px;
  width: 320px; max-width: 85vw;
}
.modal-box h3 { font-size: 16px; margin-bottom: 8px; }
.modal-box p { font-size: 14px; color: #666; margin-bottom: 16px; }
.modal-input { width: 100%; border: 1px solid #ddd; border-radius: 6px; padding: 12px; font-size: 15px; outline: none; }
.modal-input:focus { border-color: var(--primary); }
.modal-actions { display: flex; gap: 8px; margin-top: 12px; }
.modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
.modal-btn-primary { background: var(--primary); color: #fff; }
.modal-btn-default { background: #f0f0f0; color: #333; }
.modal-btn-danger { background: none; color: var(--danger); }

@media (min-width: 768px) {
  .chat-page { margin: -32px; height: calc(100dvh - 64px); }
  .chat-msgs { padding: 20px 16px; }
}
</style>

<div class="chat-page">
  <div class="chat-topbar">
    <button onclick="drawerToggle()">☰</button>
    <div class="title">芸熙烘焙</div>
    <button onclick="onNewChat()">✚</button>
  </div>

  <div class="chat-notice">⚠️ AI使用小程序导出数据，暂未对接有赞实时接口。</div>

  <div class="chat-msgs" id="chat-msgs"></div>

  <div class="chat-inputbar">
    <input type="text" id="user-input" placeholder="输入问题..." autofocus
           onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
</div>

<!-- Drawer - fixed to viewport (outside chat-page) -->
<div class="drawer-overlay" id="drawer-overlay" onclick="drawerClose()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    菜单
    <button onclick="drawerClose()">✕</button>
  </div>
  <div class="drawer-section">
    <h4>页面导航</h4>
    <a href="/admin/dashboard" class="drawer-btn">📊 概览</a>
    <a href="/admin/transfers" class="drawer-btn" style="opacity:0.4;pointer-events:none">🔔 转人工 <span style="font-size:10px;background:var(--text-muted);color:#fff;border-radius:4px;padding:1px 6px">待上线</span></a>
    <a href="/admin/logout" class="drawer-btn">🚪 退出</a>
  </div>
  <div class="drawer-section">
    <h4>已保存对话</h4>
    <div id="saved-list"></div>
  </div>
  <div class="drawer-section">
    <h4>快捷测试</h4>
    <button class="drawer-btn" onclick="sendStatic('提拉米苏多少钱')">🍰 提拉米苏多少钱</button>
    <button class="drawer-btn" onclick="sendStatic('明天下午能送到吗')">🚚 明天下午能送到吗</button>
    <button class="drawer-btn" onclick="sendStatic('蛋糕坏了我要退款')">⚠️ 蛋糕坏了要退款</button>
    <button class="drawer-btn" onclick="sendStatic('哈喽在吗')">👋 哈喽在吗</button>
  </div>
  <div class="drawer-section">
    <h4>调试信息</h4>
    <div class="drawer-debug">
      <table>
        <tr><td>意图</td><td id="dbg-intent">-</td></tr>
        <tr><td>耗时</td><td id="dbg-time">-</td></tr>
        <tr><td>Token</td><td id="dbg-tokens">-</td></tr>
      </table>
    </div>
  </div>
</div>

<!-- Modal - fixed to viewport (outside chat-page) -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <h3>当前对话未保存</h3>
    <p>保存后可在菜单中查看。</p>
    <input class="modal-input" id="modal-name" placeholder="输入对话名称">
    <div class="modal-actions">
      <button class="modal-btn-primary" onclick="saveAndNew()">保存并新建</button>
      <button class="modal-btn-default" onclick="discardAndNew()">不保存</button>
    </div>
    <div class="modal-actions">
      <button class="modal-btn-danger" onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<script>
var _auth = {headers: {'Authorization': 'Bearer 100200'}};
var _userScrolledUp = false;

function _ls(k, v) {
  if (v === undefined) return localStorage.getItem('chat_' + k);
  if (v === null) localStorage.removeItem('chat_' + k);
  else localStorage.setItem('chat_' + k, v);
}

var _userId = _ls('userId') || '';
var _currentSessionId = _ls('sessionId');
var _hasName = _ls('hasName') === '1';
if (!_userId || _userId === 'admin_tester') {
  _userId = 't_' + Date.now();
  _currentSessionId = '';
  _ls('userId', _userId);
  _ls('sessionId', null);
}
if (!_hasName) {
  _currentSessionId = '';
  _ls('sessionId', null);
}

var _msgs = document.getElementById('chat-msgs');
_msgs.addEventListener('scroll', function() {
  _userScrolledUp = _msgs.scrollHeight - _msgs.scrollTop - _msgs.clientHeight > 80;
});
function scrollBtm() { _msgs.scrollTop = _msgs.scrollHeight; _userScrolledUp = false; }
function nearBtm() { return _msgs.scrollHeight - _msgs.scrollTop - _msgs.clientHeight < 120; }

// Drawer
function drawerToggle() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('drawer-overlay').classList.toggle('show');
}
function drawerClose() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('show');
}

// Saved list
async function loadSaved() {
  try {
    var r = await fetch('/api/v1/admin/chat-test/sessions', _auth);
    var d = await r.json();
    var el = document.getElementById('saved-list');
    if (d.code !== 0 || !d.data || d.data.length === 0) {
      el.innerHTML = '<div style="padding:10px 16px;font-size:14px;color:#ccc">暂无保存的对话</div>';
      return;
    }
    var h = '';
    for (var s of d.data) {
      h += '<div class="drawer-item" onclick="openSession(\'' + s.id + '\',\'' + s.user_id + '\')"><span class="name">' + esc(s.name) + '</span><span class="del" onclick="event.stopPropagation();delSession(\'' + s.id + '\')">✕</span></div>';
    }
    el.innerHTML = h;
  } catch(e) { console.error('loadSaved error:', e); }
}

async function openSession(sid, uid) {
  _hasName = true;
  _ls('hasName', '1');
  if (uid) { _userId = uid; _ls('userId', uid); }
  _currentSessionId = sid; _ls('sessionId', sid);
  try {
    var r = await fetch('/api/v1/admin/sessions/' + sid + '/messages', _auth);
    var d = await r.json();
    if (d.code !== 0 || !d.data) return;
    _msgs.innerHTML = '';
    for (var m of d.data) addMsg(m.role, m.content);
    scrollBtm(); drawerClose();
    document.querySelectorAll('.drawer-item').forEach(function(el){el.classList.remove('active')});
    var items = document.querySelectorAll('.drawer-item');
    for (var i = 0; i < items.length; i++) {
      if (items[i].textContent.indexOf(sid.slice(0,8)) >= 0) { items[i].classList.add('active'); break; }
    }
  } catch(e) {}
}

async function delSession(sid) {
  if (!confirm('确定丢弃？')) return;
  try { await fetch('/api/v1/admin/chat-test/session/' + sid, { method: 'DELETE', ..._auth }); } catch(e) {}
  if (_currentSessionId === sid) { _currentSessionId = ''; _ls('sessionId', null); _hasName = false; resetChat(); }
  loadSaved();
}

// Restore session on page load
async function restore() {
  if (_currentSessionId) {
    try {
      var r = await fetch('/api/v1/admin/sessions/' + _currentSessionId + '/messages', _auth);
      var d = await r.json();
      if (d.code === 0 && d.data && d.data.length > 0) {
        _msgs.innerHTML = '';
        for (var m of d.data) addMsg(m.role, m.content);
        scrollBtm();
        return;
      }
    } catch(e) {}
  }
}

function addMsg(role, content) {
  var cls = role === 'user' ? 'msg-row end' : 'msg-row start';
  var bub = role === 'user' ? 'bubble user' : 'bubble ai';
  _msgs.innerHTML += '<div class="' + cls + '"><div class="' + bub + '">' + esc(content) + '</div></div>';
}

// New chat
function onNewChat() {
  drawerClose();
  if (_hasName) { startNewChat(); return; }
  document.getElementById('modal').classList.add('show');
  document.getElementById('modal-name').value = '';
  setTimeout(function(){ document.getElementById('modal-name').focus(); }, 100);
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

function startNewChat() {
  _currentSessionId = ''; _ls('sessionId', null);
  _hasName = false; _ls('hasName', null);
  _userId = 't_' + Date.now(); _ls('userId', _userId);
  resetChat();
}

async function saveAndNew() {
  var name = document.getElementById('modal-name').value.trim();
  if (!name) { return; }
  if (_currentSessionId) {
    try {
      var r = await fetch('/api/v1/admin/chat-test/save', {
        method: 'POST', ..._auth,
        headers: {'Content-Type': 'application/json', ..._auth.headers},
        body: JSON.stringify({session_id: _currentSessionId, name: name})
      });
      var d = await r.json();
      if (d.code === 0) {
        _hasName = true;
        _ls('hasName', '1');
        showToast('已保存', 'success');
      } else {
        showToast('保存失败: ' + (d.message || ''), 'error');
      }
    } catch(e) { showToast('保存失败', 'error'); }
  }
  closeModal();
  startNewChat();
  loadSaved();
}

async function discardAndNew() {
  closeModal();
  if (_currentSessionId) {
    try { await fetch('/api/v1/admin/chat-test/session/' + _currentSessionId, { method: 'DELETE', ..._auth }); } catch(e) {}
  }
  startNewChat();
}

function resetChat() {
  _msgs.innerHTML = '<div class="msg-row start"><div class="bubble ai">👋 你好，我是在线客服，有什么可以帮你的~</div></div>';
  document.getElementById('dbg-intent').textContent = '-';
  document.getElementById('dbg-time').textContent = '-';
  document.getElementById('dbg-tokens').textContent = '-';
}

// Send
function now() { return new Date().toLocaleTimeString(); }
function sendStatic(text) { send(text); drawerClose(); }

async function send(msg) {
  var input = document.getElementById('user-input');
  var text = msg || input.value.trim();
  if (!text) return;
  if (!msg) input.value = '';
  _userScrolledUp = false;
  addMsg('user', text);
  _msgs.innerHTML += '<div class="msg-row start" id="loading-row"><div class="bubble ai loading">⏳ 正在思考...</div></div>';
  scrollBtm();
  var t0 = Date.now();
  try {
    var resp = await fetch('/api/v1/admin/chat-test', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer 100200'},
      body: JSON.stringify({content: text, user_id: _userId})
    });
    var data = await resp.json();
    var loadingEl = document.getElementById('loading-row');
    if (loadingEl) { loadingEl.outerHTML = ''; }
    addMsg('assistant', data.reply || '(无回复)');
    if (data.session_id) { _currentSessionId = data.session_id; _ls('sessionId', data.session_id); }
    document.getElementById('dbg-intent').textContent = {1:'商品',2:'运费',3:'配送',4:'售后',5:'闲聊'}[data.intent] || data.intent;
    document.getElementById('dbg-time').textContent = ((Date.now()-t0)/1000).toFixed(1) + 's';
    document.getElementById('dbg-tokens').textContent = data.tokens || '-';
  } catch(e) {
    var loadingEl = document.getElementById('loading-row');
    if (loadingEl) { loadingEl.outerHTML = ''; }
    addMsg('assistant', '❌ 请求失败');
  }
  if (nearBtm()) scrollBtm();
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Init
_msgs.innerHTML = '<div class="msg-row start"><div class="bubble ai">👋 你好，我是在线客服，有什么可以帮你的~</div></div>';
restore();
loadSaved();
</script>
{% endblock %}
