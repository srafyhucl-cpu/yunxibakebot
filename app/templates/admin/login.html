{% extends "admin/base.html" %}
{% block login_content %}
<div class="login-page">
  <div class="login-card">
    <h1>🍰 芸熙烘焙</h1>
    <p>AI 客服管理后台</p>
    {% if error %}
    <p style="color:var(--danger);text-align:center;margin-bottom:16px;font-size:14px;">{{ error }}</p>
    {% endif %}
    <form method="post" action="/admin/login">
      <div style="margin-bottom:16px;">
        <label style="font-size:14px;color:var(--text-muted);display:block;margin-bottom:6px;">管理员密码</label>
        <input type="password" name="token" placeholder="请输入管理后台 Token" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
  </div>
</div>
{% endblock %}
