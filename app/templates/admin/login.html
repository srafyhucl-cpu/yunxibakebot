{% extends "admin/base.html" %}
{% block login_content %}
<style>
.login-card label { display:block;font-size:13px;font-weight:500;color:var(--text-muted);margin-bottom:6px; }
.login-card input[type="password"] { font-size:16px; /* 防止 iOS 自动缩放 */ }
.login-card .btn { min-height:48px;font-size:16px; }
</style>
<div class="login-page">
  <div class="login-card">
    <h1>🍰 芸熙烘焙</h1>
    <p style="color:var(--text-muted);margin-bottom:24px;">AI 客服管理后台</p>
    {% if error %}
    <div style="background:#fde8e8;color:#c0392b;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:14px;">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
      <div style="margin-bottom:16px;">
        <label for="token">管理员密码</label>
        <input type="password" id="token" name="token"
               placeholder="请输入管理员密码" autofocus autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>
  </div>
</div>
{% endblock %}
